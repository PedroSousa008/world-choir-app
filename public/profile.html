  <meta name="theme-color" content="#000000">
    <script>
    /* Apply persisted theme before first paint — default dark, never flash wrong theme */
    (function () {
      try {
        var t = localStorage.getItem('wc_theme_v1');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        document.documentElement.style.setProperty('--wc-boot-bg', t === 'light' ? '#ffffff' : '#000000');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#ffffff' : '#000000');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.setProperty('--wc-boot-bg', '#000000');
      }
    })();
  </script>
<style id="wc-boot-critical">
    html.wc-booting:not(.wc-boot-skeletons)::before{content:"";position:fixed;inset:0;z-index:2147483000;background:var(--wc-boot-bg,#000);pointer-events:none}
    html.wc-booting.wc-nav-handoff:not(.wc-boot-skeletons)::before{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
    html.wc-booting:not(.wc-boot-skeletons),html.wc-booting:not(.wc-boot-skeletons) body{background:var(--wc-boot-bg,#000)!important}
  </style>
  <script>
    /* TEST REVERT: set true to show skeletons again instead of a black boot screen */
    window.WC_SHOW_SKELETONS = false;
    document.documentElement.classList.add('wc-booting');
    if (window.WC_SHOW_SKELETONS) document.documentElement.classList.add('wc-boot-skeletons');
    try {
      var _wcNavT = sessionStorage.getItem('wc_nav_transition_v1');
      if (_wcNavT) {
        var _wcNavD = JSON.parse(_wcNavT);
        if (_wcNavD && _wcNavD.to && (Date.now() - (_wcNavD.at || 0) < 1500)) {
          document.documentElement.classList.add('wc-nav-handoff');
        }
      }
    } catch (e) {}
  </script>

    </div>
    <div id="profile-participation-root" aria-busy="true">

        <span class="wc-skel wc-skel--line wc-skel--line-mid"></span>
        <span class="wc-skel wc-skel--line"></span>
        <span class="wc-skel wc-skel--line wc-skel--line-short"></span>
      </div>
    </div>
    <div id="profile-practice-root" aria-busy="true">
      <div class="wc-skel-card" aria-hidden="true">

    </div>
    <div id="profile-history-root" aria-busy="true">

    </div>
    <div id="profile-invite-root" aria-busy="true">

    </div>
    <div id="profile-daily-acts-root" aria-busy="true">

    <footer class="profile-legal-footer" aria-label="Legal">

  <!-- Change participation location modal — manual city/country, no GPS -->
  <div class="overlay" id="change-location-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="location-modal-title">
      <h2 class="modal-title" id="location-modal-title">Change Participation Location</h2>
      <p class="modal-copy" id="location-modal-copy">
        Update where you will sing from. Your light on the map will move to your new city.
      </p>

      <div class="form-group">
        <label class="form-label" for="location-country">Country</label>
        <select class="form-input form-select" id="location-country">
          <option value="">Select country</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="location-city">City</label>
        <input class="form-input" id="location-city" type="text" placeholder="Your city" autocomplete="address-level2">
      </div>

      <div class="actions-row">
        <button class="btn btn-primary" id="location-confirm" type="button">Save Location</button>
        <button class="btn btn-secondary" id="location-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Practice Mode — full screen -->
