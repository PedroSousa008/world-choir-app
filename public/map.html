<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>World Choir — The Earth Breathes</title>
  <link rel="icon" type="image/png" href="images/world-choir-logo.png?v=20270706">
  <link rel="apple-touch-icon" href="images/world-choir-logo.png?v=20270706">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="preload" href="https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/world-choir-theme.css?v=20260902t">
  <link rel="stylesheet" href="css/map.css?v=20260902l">
  <link rel="stylesheet" href="css/live-event.css?v=20260903b">
  <link rel="stylesheet" href="css/profile.css?v=20270706b">
  <link rel="stylesheet" href="css/daily-peace.css?v=20260810e">
  <style>
    #map-empty { display: none !important; }
    #map-empty:not(.hidden) { display: block !important; }
    #map-empty-btn { display: none !important; }
    #map-empty-btn:not([hidden]) { display: inline-flex !important; }
    #map-empty-btn-skeleton { display: none; }
    #map-empty-btn-skeleton.visible { display: block; }
    .map-stats__values { display: none !important; }
    .map-stats--loaded .map-stats__values { display: flex !important; }
    .map-stats__loading { display: flex !important; }
    .map-stats--loaded .map-stats__loading { display: none !important; }
    .map-data-loading { display: none; }
    .map-data-loading.is-visible { display: block; }
  </style>
</head>
<body>
  <div class="map-page__stars"></div>

  <div class="map-shell">
    <button type="button" class="map-header" id="map-header" aria-expanded="true" aria-label="The Earth Breathes — tap to minimize">
      <span class="map-header__dot" aria-hidden="true"></span>
      <span class="map-header__content">
        <span class="map-header__default" id="map-header-default">
          <span class="map-header__title">The Earth Breathes</span>
          <span class="map-header__subtitle">Every light is a real voice preparing to sing.</span>
          <span class="map-header__countdown" id="map-countdown">—</span>
        </span>
        <span class="map-header__sponsor" id="map-header-sponsor" hidden>
          <span class="map-header__title map-header__title--aurora">World Choir supported by</span>
          <div class="map-sponsor" id="map-sponsor-root">
            <div class="map-sponsor__viewport" id="map-sponsor-viewport" aria-label="World Choir sponsors"></div>
          </div>
        </span>
      </span>
    </button>

    <div id="world-map"></div>

    <div class="map-data-loading" id="map-data-loading" aria-live="polite" hidden>
      <p class="map-data-loading__text" id="map-data-loading-text"></p>
    </div>

    <div class="map-stats map-stats--loading" id="map-stats">
      <div class="map-stats__loading" id="map-stats-loading" aria-hidden="false">
        <div class="map-stat map-stat--shimmer">
          <span class="map-stat__shimmer" aria-hidden="true"></span>
          <span class="map-stat__lbl">Voices</span>
        </div>
        <div class="map-stat map-stat--shimmer">
          <span class="map-stat__shimmer" aria-hidden="true"></span>
          <span class="map-stat__lbl">Cities</span>
        </div>
        <div class="map-stat map-stat--shimmer">
          <span class="map-stat__shimmer" aria-hidden="true"></span>
          <span class="map-stat__lbl">Countries</span>
        </div>
      </div>
      <div class="map-stats__values" id="map-stats-values">
        <div class="map-stat">
          <span class="map-stat__num" id="stat-voices">0</span>
          <span class="map-stat__lbl">Voices</span>
        </div>
        <div class="map-stat">
          <span class="map-stat__num" id="stat-cities">0</span>
          <span class="map-stat__lbl">Cities</span>
        </div>
        <div class="map-stat">
          <span class="map-stat__num" id="stat-countries">0</span>
          <span class="map-stat__lbl">Countries</span>
        </div>
      </div>
    </div>

    <div class="map-empty hidden" id="map-empty">
      <p class="map-empty__title">No voices yet</p>
      <p class="map-empty__copy">Be the first to light up the world.</p>
      <div class="map-empty__cta" id="map-empty-cta">
        <div class="map-empty__btn-skeleton" id="map-empty-btn-skeleton" aria-hidden="true"></div>
        <button class="map-empty__btn" id="map-empty-btn" type="button" hidden>I'll Sing</button>
      </div>
    </div>

    <div class="city-card" id="city-card">
      <p class="city-card__place" id="city-card-place">—</p>
      <p class="city-card__voices" id="city-card-voices">—</p>
      <p class="city-card__gathering" id="city-card-gathering"></p>
    </div>
  </div>

  <div class="voice-joined" id="voice-joined">
    <p class="voice-joined__text">Your voice is now part of the world.</p>
  </div>

  <!-- Shared participation modal -->
  <div class="overlay" id="participation-overlay">
    <div class="modal" role="dialog" aria-labelledby="participation-title">
      <h2 class="modal-title" id="participation-title">Where will you sing from?</h2>
      <p class="modal-copy">Choose the city and country where you plan to join World Choir. You can change this later in your profile.</p>
      <div class="form-group">
        <label class="form-label" for="pledge-country">Country</label>
        <select class="form-input form-select" id="pledge-country">
          <option value="">Select country</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="pledge-city">City</label>
        <input class="form-input" id="pledge-city" type="text" placeholder="Your city" autocomplete="address-level2">
      </div>
      <div class="actions-row">
        <button class="btn btn-primary" id="participation-confirm" type="button">Confirm Participation</button>
        <button class="btn btn-secondary" id="participation-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div id="nav-root"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="js/world-choir-config.js?v=20260813p"></script>
  <script src="js/world-choir-countries.js?v=20260831a"></script>
  <script src="js/world-choir-db.js?v=20260819h"></script>
  <script src="js/world-choir-pledge-state.js?v=20270707g"></script>
  <script src="js/world-choir-nav.js?v=20260902t"></script>
  <script src="js/world-choir-participation.js?v=20270707g"></script>
  <script src="js/profile/daily-acts-peace.js?v=20260819a"></script>
  <script src="js/world-choir-map-tiles.js?v=20260826h"></script>
  <script src="js/map/sponsor-constants.js?v=20260902k"></script>
  <script src="js/map/sponsor-data.js?v=20260901b"></script>
  <script src="js/map/sponsor-bar.js?v=20260902r"></script>
  <script src="js/world-choir-practice-config.js"></script>
  <script src="js/profile/lyrics-display.js"></script>
  <script src="js/live-event/live-event-config.js?v=20260903b"></script>
  <script src="js/live-event/server-time-sync.js?v=20260903b"></script>
  <script src="js/live-event/global-live-event.js?v=20260903b"></script>
  <script src="js/world-choir-live-event.js?v=20260903b"></script>
  <script src="js/world-choir-global-live-bootstrap.js?v=20260903b"></script>
  <script src="js/world-choir-map.js?v=20260902j"></script>
  <script>WorldChoirMap.init();</script>
</body>
</html>
