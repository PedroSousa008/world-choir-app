<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Contact World Choir — email, Instagram, and TikTok.">
  <title>World Choir — Contact</title>
  <link rel="icon" type="image/png" href="images/world-choir-logo.png?v=20270706">
  <link rel="apple-touch-icon" href="images/world-choir-logo.png?v=20270706">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/world-choir-theme.css?v=20260903o">
  <link rel="stylesheet" href="css/contact-page.css?v=20260902c">
  <link rel="stylesheet" href="css/live-event.css?v=20260904an">
  <script src="js/world-choir-event-schedule.js?v=20260904bv"></script>
  <script src="js/live-event/live-event-config.js?v=20260904an"></script>
  <script src="js/live-event/live-event-boot.js?v=20260904an"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <main class="page contact-page">
    <a class="contact-back" href="profile.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Profile
    </a>

    <header class="contact-header">
      <p class="contact-brand">World Choir</p>
      <h1 class="contact-title">Contact</h1>
    </header>

    <div class="contact-list">
      <a class="contact-card contact-card--email" href="mailto:worldchoirapp@gmail.com">
        <span class="contact-card__icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M4 7.5l8 5.2 8-5.2M4 7h16v10H4V7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="contact-card__body">
          <span class="contact-card__label">Email</span>
          <span class="contact-card__value">worldchoirapp@gmail.com</span>
        </span>
        <span class="contact-card__chevron" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <a class="contact-card contact-card--instagram" href="https://instagram.com/worldchoirapp" target="_blank" rel="noopener noreferrer">
        <span class="contact-card__icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="4" y="4" width="16" height="16" rx="4.5" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="17.1" cy="6.9" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span class="contact-card__body">
          <span class="contact-card__label">Instagram</span>
          <span class="contact-card__value">@worldchoirapp</span>
        </span>
        <span class="contact-card__chevron" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <a class="contact-card contact-card--tiktok" href="https://www.tiktok.com/@_worldchoirapp" target="_blank" rel="noopener noreferrer">
        <span class="contact-card__icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M14 4v10.2a3.8 3.8 0 11-2.6-3.6V8.2A6 6 0 0014 8V4h2.2A4.8 4.8 0 0019.5 7V9A6.8 6.8 0 0116.2 8v6.2A5.8 5.8 0 118 8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="contact-card__body">
          <span class="contact-card__label">TikTok</span>
          <span class="contact-card__value">@_worldchoirapp</span>
        </span>
        <span class="contact-card__chevron" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>
    </div>

    <div class="contact-info-card">
      <span class="contact-info-card__icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 20.5s-6.5-4.2-6.5-9.4A4.6 4.6 0 0112 6.5a4.6 4.6 0 016.5 4.6c0 5.2-6.5 9.4-6.5 9.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <p class="contact-info-card__text">
        Questions about participation, Creator Foundations, privacy, or partnerships?
        Reach out by email or follow us on social media for updates.
      </p>
    </div>
  </main>

  <div id="nav-root"></div>

  <script src="js/world-choir-a11y.js?v=20260903o"></script>
  <script src="js/world-choir-nav.js?v=20260904cc"></script>
  <script>WorldChoirNav.startWatcher('profile');</script>
</body>
</html>
