<body>
  <div class="ambient-bg"></div>

  <main class="page passport-page" id="passport-page">
    <div id="passport-root" aria-live="polite"></div>
  </main>

  <div class="overlay" id="passport-info-overlay" aria-hidden="true">
    <div class="modal passport-info-modal" role="dialog" aria-labelledby="passport-info-title">
      <h2 class="modal-title" id="passport-info-title">Your World Choir Passport</h2>
      <p class="modal-copy">
        Your World Choir Passport is a permanent record of your participation in World Choir.
        It contains your unique Voice Number, your location, your participation history,
        and milestones from your journey.
      </p>
      <section class="passport-actions passport-info-modal__actions" id="passport-info-actions" aria-label="Passport actions" hidden>
        <button type="button" class="passport-action passport-action--stamps-only" id="passport-action-download" aria-label="Download World Choir Passport" hidden>
          <span class="passport-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span>
          <span class="passport-action__label">Download</span>
        </button>
        <button type="button" class="passport-action passport-action--stamps-only passport-action--wallet-apple" id="passport-action-wallet" aria-label="Add to Apple Wallet" hidden>
          <span class="passport-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg></span>
          <span class="passport-action__label">Add to Apple Wallet</span>
        </button>
        <button type="button" class="passport-action passport-action--stamps-only" id="passport-action-share" aria-label="Share World Choir Passport" hidden>
          <span class="passport-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 13.2 7.5 4.1"/><path d="m15.7 6.7-7.5 4.1"/></svg></span>
          <span class="passport-action__label">Share</span>
        </button>
      </section>
      <div class="actions-row passport-info-modal__footer">
        <button class="btn btn-primary" id="passport-info-close" type="button">Got it</button>
      </div>
    </div>
  </div>

  <div class="passport-toast" id="passport-toast" role="status" aria-live="polite" hidden></div>

  <div id="nav-root"></div>
