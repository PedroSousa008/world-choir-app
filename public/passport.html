<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Your World Choir Passport — a permanent record of your voice in the global choir.">
  <title>World Choir — Passport</title>
  <link rel="icon" type="image/png" href="images/world-choir-logo.png?v=20270706">
  <link rel="apple-touch-icon" href="images/world-choir-logo.png?v=20270706">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/world-choir-theme.css?v=20260903o">
  <link rel="stylesheet" href="css/passport.css?v=20260903o">
  <link rel="stylesheet" href="css/daily-peace.css?v=20260810e">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="preload" as="image" href="images/passport/passport-feature.png?v=20260821b">
  <link rel="preload" as="image" href="images/passport/passport-inside-bg.png?v=20260827c" fetchpriority="high">
  <link rel="stylesheet" href="css/live-event.css?v=20260904aq">
  <script src="js/world-choir-event-schedule.js?v=20260904aq"></script>
  <script src="js/live-event/live-event-config.js?v=20260904aq"></script>
  <script src="js/live-event/live-event-boot.js?v=20260904aq"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <main class="page passport-page" id="passport-page">
    <div id="passport-root" aria-live="polite"></div>
  </main>

  <div class="overlay" id="passport-info-overlay" aria-hidden="true">
    <div class="modal passport-info-modal" role="dialog" aria-labelledby="passport-info-title">
      <h2 class="modal-title" id="passport-info-title">Your World Choir Passport</h2>
      <p class="modal-copy">
        Your World Choir Passport is a permanent record of your participation in World Choir.
        It contains your unique Voice Number, your location, your participation history,
        and milestones from your journey.
      </p>
      <section class="passport-actions passport-info-modal__actions" id="passport-info-actions" aria-label="Passport actions" hidden>
        <button type="button" class="passport-action passport-action--stamps-only" id="passport-action-download" aria-label="Download World Choir Passport" hidden>
          <span class="passport-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span>
          <span class="passport-action__label">Download</span>
        </button>
        <button type="button" class="passport-action passport-action--stamps-only" id="passport-action-share" aria-label="Share World Choir Passport" hidden>
          <span class="passport-action__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 13.2 7.5 4.1"/><path d="m15.7 6.7-7.5 4.1"/></svg></span>
          <span class="passport-action__label">Share</span>
        </button>
      </section>
      <div class="actions-row passport-info-modal__footer">
        <button class="btn btn-primary" id="passport-info-close" type="button">Got it</button>
      </div>
    </div>
  </div>

  <div class="passport-toast" id="passport-toast" role="status" aria-live="polite" hidden></div>

  <div id="nav-root"></div>

  <script src="js/world-choir-event-schedule.js?v=20260904aq"></script>
  <script src="js/world-choir-config.js?v=20260901i"></script>
  <script src="js/world-choir-db.js?v=20260819h"></script>
  <script src="js/world-choir-a11y.js?v=20260903o"></script>
  <script src="js/world-choir-nav.js?v=20260903o"></script>
  <script src="js/profile/daily-acts-peace.js?v=20260819a"></script>
  <script src="js/profile/passport-route.js?v=20260901b"></script>
  <script src="js/profile/passport-stamps.js?v=20260902a"></script>
  <script src="js/profile/world-choir-passport.js?v=20260902q"></script>
  <script src="js/world-choir-flags.js?v=20260902n"></script>
  <script src="js/profile/pass-the-world-map.js?v=20260902b"></script>
  <script src="js/profile/pass-the-world.js?v=20260902c"></script>
  <script src="js/profile/passport-page.js?v=20260902q"></script>
  <script>PassportPage.init();</script>
</body>
</html>
