  <style id="wc-boot-critical">
    html.wc-booting:not(.wc-boot-skeletons)::before{content:"";position:fixed;inset:0;z-index:2147483000;background:#000;pointer-events:none}
    html.wc-booting.wc-nav-handoff:not(.wc-boot-skeletons)::before{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
    html.wc-booting:not(.wc-boot-skeletons),html.wc-booting:not(.wc-boot-skeletons) body{background:#000!important}
  </style>
  <script>
    /* TEST REVERT: set true to show skeletons again instead of a black boot screen */
    window.WC_SHOW_SKELETONS = false;
    document.documentElement.classList.add('wc-booting');
    if (window.WC_SHOW_SKELETONS) document.documentElement.classList.add('wc-boot-skeletons');
    try {
      var _wcNavT = sessionStorage.getItem('wc_nav_transition_v1');
      if (_wcNavT) {
        var _wcNavD = JSON.parse(_wcNavT);
        if (_wcNavD && _wcNavD.to && (Date.now() - (_wcNavD.at || 0) < 1500)) {
          document.documentElement.classList.add('wc-nav-handoff');
        }
      }
    } catch (e) {}
  </script>
