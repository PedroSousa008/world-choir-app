<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="World Chain — real people, real connections, a global chain of voices.">
  <title>World Choir — World Chain</title>
  <link rel="icon" type="image/png" href="images/world-choir-logo.png?v=20270706">
  <link rel="apple-touch-icon" href="images/world-choir-logo.png?v=20270706">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/world-choir-theme.css?v=20260903p">
  <link rel="stylesheet" href="css/world-chain.css?v=20260905ab">
  <link rel="stylesheet" href="css/live-event.css?v=20260904as">
  <script src="js/world-choir-event-schedule.js?v=20260904bv"></script>
  <script src="js/live-event/live-event-config.js?v=20260904as"></script>
  <script src="js/live-event/live-event-boot.js?v=20260904as"></script>
</head>
<body>
  <div class="ambient-bg"></div>

  <main class="page world-chain-page" id="world-chain-page">
    <!-- HTML-inline first paint: never empty. Inline boot swaps to detail/completed skeleton from URL. -->
    <div id="world-chain-root" aria-live="polite" aria-busy="true">
      <div class="wc-chain-boot wc-chain-boot--landing">
        <header class="wc-chain-topbar">
          <a class="wc-chain-back" href="index.html" aria-label="Back to Home">←</a>
          <h1 class="wc-chain-brand">World Chain</h1>
          <span class="wc-chain-topbar__spacer" aria-hidden="true"></span>
        </header>
        <div class="wc-chain-hero wc-chain-hero--skel" aria-hidden="true"></div>
        <div class="wc-chain-skel" aria-hidden="true"></div>
        <div class="wc-chain-skel" aria-hidden="true"></div>
        <div class="wc-chain-skel" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <div id="nav-root"></div>

  <script>
    (function () {
      var root = document.getElementById('world-chain-root');
      if (!root) return;
      var params = new URLSearchParams(window.location.search);
      var chain = params.get('chain');
      var view = params.get('view');
      var topbar =
        '<header class="wc-chain-topbar">' +
          '<button type="button" class="wc-chain-back" aria-label="Back">←</button>' +
          '<h1 class="wc-chain-brand">World Chain</h1>' +
          '<span class="wc-chain-topbar__spacer" aria-hidden="true"></span>' +
        '</header>';

      if (chain && view === 'photo-book') {
        root.innerHTML =
          '<div class="wc-photobook-page wc-chain-boot" aria-busy="true">' +
            topbar +
            '<div class="wc-photobook-header">' +
              '<div class="wc-viewer-skel-title" aria-hidden="true"></div>' +
              '<div class="wc-chain-skel" style="height:14px;width:70%;margin:12px auto 0" aria-hidden="true"></div>' +
            '</div>' +
            '<div class="wc-photobook-grid" aria-hidden="true">' +
              Array(6).fill(0).map(function () {
                return '<article class="wc-photobook-card wc-photobook-card--skel">' +
                  '<div class="wc-photobook-card__photo"></div>' +
                  '<div class="wc-photobook-card__meta"><div class="wc-chain-skel" style="height:10px;width:70%"></div></div>' +
                  '<div class="wc-photobook-card__note"></div>' +
                '</article>';
              }).join('') +
            '</div>' +
          '</div>';
        return;
      }

      if (chain) {
        var bookIcon =
          '<svg class="wc-chain-help__icon" viewBox="0 0 24 24" width="18" height="18" focusable="false" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">' +
            '<path d="M4 5.5C4 4.67 4.67 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/>' +
            '<path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13Z"/>' +
            '<path d="M12 4v16" stroke-linecap="round"/>' +
          '</svg>';
        var detailTopbar =
          '<header class="wc-chain-topbar">' +
            '<button type="button" class="wc-chain-back" aria-label="Back">←</button>' +
            '<h1 class="wc-chain-brand">World Chain</h1>' +
            '<button type="button" class="wc-chain-help" aria-label="Open Photo Book" title="Open Photo Book">' + bookIcon + '</button>' +
          '</header>';
        root.innerHTML =
          '<div class="wc-viewer wc-chain-boot wc-chain-boot--detail" aria-busy="true">' +
            detailTopbar +
            '<div class="wc-viewer-skel-title" aria-hidden="true"></div>' +
            '<div class="wc-viewer-skel-route" aria-hidden="true"></div>' +
            '<div class="wc-viewer-skel-stats" aria-hidden="true"></div>' +
            '<div class="wc-chain-skel wc-chain-skel--strip" aria-hidden="true"></div>' +
            '<div class="wc-viewer-skel-card" aria-hidden="true">' +
              '<div class="wc-chain-skel" aria-hidden="true"></div>' +
              '<div class="wc-chain-skel" aria-hidden="true"></div>' +
              '<div class="wc-chain-skel" aria-hidden="true"></div>' +
            '</div>' +
            '<div class="wc-chain-skel wc-chain-skel--cta" aria-hidden="true"></div>' +
          '</div>';
        return;
      }

      if (view === 'completed') {
        root.innerHTML =
          '<div class="wc-chain-boot wc-chain-boot--completed" aria-busy="true">' +
            topbar +
            '<div class="wc-viewer-skel-title wc-viewer-skel-title--sm" aria-hidden="true"></div>' +
            '<div class="wc-chain-skel" aria-hidden="true"></div>' +
            '<div class="wc-chain-skel" aria-hidden="true"></div>' +
          '</div>';
      }
    })();
  </script>

  <script src="js/world-choir-config.js?v=20260904bl"></script>
  <script src="js/world-choir-db.js?v=20260904bx"></script>
  <script src="js/world-choir-a11y.js?v=20260903p"></script>
  <script src="js/world-choir-nav.js?v=20260904cc"></script>
  <script src="js/world-choir-flags.js?v=20260905s"></script>
  <script src="js/world-chain-page.js?v=20260905ab"></script>
  <script>WorldChainPage.init();</script>
</body>
</html>
