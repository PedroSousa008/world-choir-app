<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="World Choir Passport — one of the voices of World Choir.">
  <title>World Choir Passport</title>
  <link rel="icon" type="image/png" href="/images/world-choir-logo.png?v=20270706">
  <link rel="stylesheet" href="/css/world-choir-theme.css?v=20270706b">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .passport-public {
      width: min(100%, 420px);
      text-align: center;
    }
    .passport-public__logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 18px;
    }
    .passport-public__kicker {
      margin: 0 0 8px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4ec5e8;
      font-weight: 700;
    }
    .passport-public__title {
      margin: 0 0 24px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .passport-public__card {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(11,52,107,0.95), rgba(8,28,58,0.98));
      padding: 24px 20px;
      margin-bottom: 24px;
    }
    .passport-public__voice {
      margin: 0 0 6px;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }
    .passport-public__meta {
      margin: 0;
      color: rgba(255,255,255,0.72);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .passport-public__copy {
      margin: 0 0 24px;
      color: rgba(255,255,255,0.62);
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .passport-public__actions {
      display: grid;
      gap: 12px;
    }
    .passport-public__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .passport-public__btn--primary {
      background: linear-gradient(135deg, #3d7cff 0%, #6b5ce7 100%);
      color: #fff;
    }
    .passport-public__btn--ghost {
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      background: transparent;
    }
    .passport-public__status {
      margin-top: 18px;
      color: rgba(255,255,255,0.45);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <main class="passport-public" id="passport-public-root" aria-live="polite">
    <img class="passport-public__logo" src="/images/world-choir-logo.png?v=20270706" alt="World Choir" width="72" height="72">
    <p class="passport-public__kicker">World Choir</p>
    <h1 class="passport-public__title">Passport</h1>
    <p class="passport-public__copy">Loading Passport…</p>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const token = params.get('token')
        || (pathParts.length >= 2 && pathParts[0] === 'passport' ? decodeURIComponent(pathParts[1]) : '');
      const root = document.getElementById('passport-public-root');

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderError(message) {
        root.innerHTML = `
          <img class="passport-public__logo" src="/images/world-choir-logo.png?v=20270706" alt="World Choir" width="72" height="72">
          <p class="passport-public__kicker">World Choir</p>
          <h1 class="passport-public__title">Passport</h1>
          <p class="passport-public__copy">${esc(message)}</p>
          <div class="passport-public__actions">
            <a class="passport-public__btn passport-public__btn--primary" href="/passport.html">Open World Choir</a>
          </div>
        `;
      }

      if (!token) {
        renderError('This Passport link is not valid.');
        return;
      }

      fetch('/api/passport-public?token=' + encodeURIComponent(token))
        .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          if (!ok || !data?.passport) {
            renderError(data?.error || 'This Passport could not be found.');
            return;
          }
          const p = data.passport;
          const location = [p.city, p.country].filter(Boolean).join(', ');
          root.innerHTML = `
            <img class="passport-public__logo" src="/images/world-choir-logo.png?v=20270706" alt="World Choir" width="72" height="72">
            <p class="passport-public__kicker">World Choir</p>
            <h1 class="passport-public__title">Passport</h1>
            <section class="passport-public__card" aria-label="World Choir Passport">
              <p class="passport-public__voice">${esc(p.voiceNumber || '—')}</p>
              <p class="passport-public__meta">${esc(location || p.country || 'World Choir Voice')}</p>
              ${p.memberSince ? `<p class="passport-public__meta">Member since ${esc(p.memberSince)}</p>` : ''}
            </section>
            <p class="passport-public__copy">You are one of the voices of World Choir.</p>
            <div class="passport-public__actions">
              <a class="passport-public__btn passport-public__btn--primary" href="/passport.html">Open World Choir Passport</a>
              <a class="passport-public__btn passport-public__btn--ghost" href="/">Explore World Choir</a>
            </div>
            <p class="passport-public__status">${esc(p.eventTitle || 'World Choir')}</p>
          `;
        })
        .catch(() => renderError('We could not load this Passport right now.'));
    })();
  </script>
</body>
</html>
