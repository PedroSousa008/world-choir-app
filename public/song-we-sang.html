<!DOCTYPE html>
<html lang="en" class="sws-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="World Choir — A letter to John Lennon.">
  <title>World Choir — A Letter to John Lennon</title>
  <link rel="icon" type="image/png" href="images/world-choir-logo.png?v=20270706">
  <link rel="apple-touch-icon" href="images/world-choir-logo.png?v=20270706">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/world-choir-theme.css?v=20260904e">
  <link rel="stylesheet" href="css/song-we-sang.css?v=20260904p">
</head>
<body class="sws-page-body">
  <div class="ambient-bg sws-ambient" aria-hidden="true"></div>

  <main class="page sws-page fade-in">
    <nav class="df-fp-nav" aria-label="Back to Home">
      <button class="df-fp-nav__back" type="button" id="sws-letter-back" aria-label="Back to Home">← Back</button>
    </nav>

    <header class="sws-letter-header">
      <div class="sws-letter-header__title">A LETTER TO JOHN</div>
      <div class="sws-letter-header__subtitle">FROM THE WORLD!</div>
    </header>

    <section class="sws-letter-paper" aria-label="Letter background image">
      <img
        class="sws-letter-paper__img"
        src="images/background-image.png"
        alt=""
        decoding="async"
        fetchpriority="high"
      >
    </section>

    <footer class="sws-letter-bottom" aria-label="Promise summary">
      <div class="sws-letter-bottom__card">
        <div class="sws-letter-bottom__heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21s-7.2-4.7-9.3-8.5C1.2 9.2 3 6.7 5.9 6.1c1.7-.4 3.3.2 4.4 1.5 1.1-1.3 2.7-1.9 4.4-1.5 2.9.6 4.7 3.1 3.2 6.4C19.2 16.3 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="sws-letter-bottom__kicker">YOUR PROMISE LIVES ON</div>
          <div class="sws-letter-bottom__text">
            Thank you for your voice. Thank you for your promise.
          </div>
        </div>
      </div>
    </footer>
  </main>

  <script>
    (function () {
      const btn = document.getElementById('sws-letter-back');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
      });
    })();
  </script>
</body>
</html>
