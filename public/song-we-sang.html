<!DOCTYPE html>
<html lang="en" class="sws-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A letter to John Lennon — from the world.">
  <title>World Choir — A Letter to John</title>
  <link rel="icon" type="image/png" href="images/world-choir-logo.png?v=20270706">
  <link rel="apple-touch-icon" href="images/world-choir-logo.png?v=20270706">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/world-choir-theme.css?v=20260904e">
  <link rel="stylesheet" href="css/song-we-sang.css?v=20260904t">
</head>
<body class="sws-page-body">

  <!-- ── Top nav ── -->
  <nav class="sws-nav" aria-label="Letter page navigation">
    <button class="sws-nav__back" type="button" id="sws-letter-back" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="sws-nav__title-wrap" aria-label="A Letter to John Lennon, from the World">
      <p class="sws-nav__title">A Letter to John Lennon</p>
      <p class="sws-nav__subtitle">
        <span class="sws-nav__line" aria-hidden="true"></span>
        <span class="sws-nav__subtitle-text">From the World</span>
        <span class="sws-nav__line" aria-hidden="true"></span>
      </p>
    </div>

    <button class="sws-nav__replay" type="button" id="sws-letter-replay" aria-label="Replay letter">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 3v5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </nav>

  <!-- ── Letter area ── -->
  <main class="sws-main" aria-label="A letter to John Lennon">
    <!-- Paper image + text overlay, sized together -->
    <div class="sws-paper-wrap">
      <img
        class="sws-paper-img"
        src="images/background-imagine.png"
        alt="A handwritten letter on aged parchment paper addressed to John Lennon"
        decoding="async"
        fetchpriority="high"
      >

      <!-- Screen-reader copy of full letter (always present, visually hidden) -->
      <div id="sws-letter-sr" class="sws-sr-only" aria-label="Letter to John Lennon" role="article"></div>

      <!-- Visual letter text, rendered on top of image -->
      <div
        id="sws-letter-visual"
        class="sws-letter"
        aria-hidden="true"
      ></div>
    </div>
  </main>

  <!-- ── Footer bar ── -->
  <footer class="sws-footer" aria-label="Your promise">
    <span class="sws-footer__icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <div class="sws-footer__body">
      <p class="sws-footer__label">Your Promise Lives On</p>
      <p class="sws-footer__text">Thank you for your voice. Thank you for your promise.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/world-choir-config.js?v=20260904e"></script>
  <script src="js/world-choir-db.js?v=20260904g"></script>
  <script src="js/song-we-sang/letter-content.js?v=20260904q"></script>
  <script src="js/song-we-sang/typing-engine.js?v=20260904p"></script>
  <script src="js/song-we-sang/letter-page.js?v=20260904r"></script>

  <script>
    (function () {
      // Back button
      const back = document.getElementById('sws-letter-back');
      if (back) {
        back.addEventListener('click', () => {
          if (window.history.length > 1) window.history.back();
          else window.location.href = 'index.html';
        });
      }

      // Replay is wired in letter-page.js.
    })();
  </script>
</body>
</html>
